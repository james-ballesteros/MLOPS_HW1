services:
  db:
    image: postgres:${PG_VERSION}
    container_name: mlflow_postgres
    restart: always
    expose:
      - "${PG_PORT}"
    ports:
      - "${PG_PORT}:5432"
    networks:
      - backend-network
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 3

  s3:
    image: minio/minio:latest
    container_name: mlflow_minio
    hostname: s3
    platform: linux/arm64  # Required for M1/M2 MacBooks
    restart: always
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - frontend-network
      - backend-network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
      - ./minio/minio-init.sh:/docker-entrypoint-initdb.d/minio-init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://s3:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mlflow:
    build: ./mlflow
    image: mlflow_server
    container_name: mlflow_server
    restart: always
    depends_on:
      - db
      - s3
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - frontend-network
      - backend-network
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:${MINIO_PORT}
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER}:${PG_PASSWORD}@db:${PG_PORT}/${PG_DATABASE}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./feature_engineering.csv:/home/appuser/feature_engineering.csv

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.10
    platform: linux/amd64
    container_name: mlflow_fastapi
    ports:
      - "8000:8000"
    networks:
      - backend-network
    depends_on:
      - s3
      - db
      - mlflow
    volumes:
      - ./fastapi:/home/appuser
    command: ["/home/appuser/venv/bin/uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
